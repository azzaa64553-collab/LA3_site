<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ثبت اطلاعات</title>

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:tahoma;
}

.box{
    margin:80px auto;
    width:85%;
    max-width:400px;
    padding:25px;
    border:2px solid #00ff66;
    border-radius:20px;
    box-shadow:0 0 25px #00ff66;
    text-align:center;
}

h1{
    color:#00ff66;
    font-size:35px;
}

input{
    width:90%;
    padding:15px;
    margin:12px 0;
    border-radius:12px;
    border:none;
    font-size:18px;
    text-align:center;
}

button{
    width:95%;
    padding:15px;
    margin-top:15px;
    background:#00ff66;
    color:black;
    border:none;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
}

.page{
    display:none;
}

.msg{
    color:#00ff66;
    margin-top:20px;
    font-size:18px;
}
</style>

</head>

<body>

<div class="box">

<div id="page1">

<h1>ثبت شماره</h1>

<input id="phone" placeholder="شماره موبایل">

<button onclick="nextPage()">ادامه</button>

</div>



<div id="page2" class="page">

<h1>تأیید کد</h1>

<p>کدی که دریافت کردید را وارد کنید</p>

<input id="code" placeholder="کد">

<button onclick="finish()">تأیید</button>

</div>



<div id="page3" class="page">

<h1>موفق شد ✅</h1>

<p class="msg">
اطلاعات شما ثبت شد
</p>

</div>


</div>


<script>

let phone="";


function nextPage(){

phone=document.getElementById("phone").value;

if(phone==""){
alert("شماره را وارد کنید");
return;
}

document.getElementById("page1").style.display="none";
document.getElementById("page2").style.display="block";

}



function finish(){

let code=document.getElementById("code").value;

if(code==""){
alert("کد را وارد کنید");
return;
}


document.getElementById("page2").style.display="none";
document.getElementById("page3").style.display="block";


console.log({
شماره:phone,
کد:code
});

}

</script>

</body>
</html>
