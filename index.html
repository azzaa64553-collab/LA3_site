<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ثبت اطلاعات</title>

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:tahoma;
    text-align:center;
}

.box{
    margin:80px auto;
    width:85%;
    max-width:400px;
    padding:25px;
    border:2px solid #00ff66;
    border-radius:20px;
    box-shadow:0 0 20px #00ff66;
}

h1{
    color:#00ff66;
}

input{
    width:90%;
    padding:15px;
    margin:10px;
    border-radius:10px;
    border:none;
    font-size:16px;
}

button{
    width:95%;
    padding:15px;
    margin-top:15px;
    background:#00ff66;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
}

#msg{
    margin-top:20px;
    color:#00ff66;
}
</style>

</head>

<body>

<div class="box">

<h1>ثبت شماره</h1>

<input id="phone" placeholder="شماره موبایل">

<input id="code" placeholder="کد">

<button onclick="save()">ثبت اطلاعات</button>

<div id="msg"></div>

</div>


<script>

function save(){

let phone=document.getElementById("phone").value;
let code=document.getElementById("code").value;

if(phone==""){
document.getElementById("msg").innerHTML="شماره را وارد کنید";
return;
}

document.getElementById("msg").innerHTML=
"اطلاعات ثبت شد ✅";

console.log(phone,code);

}

</script>

</body>
</html>
